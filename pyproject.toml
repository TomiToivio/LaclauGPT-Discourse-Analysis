[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "laclaugpt"
version = "1.0.0"
description = "LaclauGPT: theory-guided LLM-assisted discourse analysis (minimal academic reference implementation)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Tomi Toivio" }]
keywords = [
    "discourse-analysis", "laclau", "mouffe", "populism",
    "computational-social-science", "critical-ai-studies",
]
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
# A real model provider is injected as a callable; none is required by
# the core. Ollama is the reference provider used with the paper.
ollama = ["ollama>=0.4"]
dev = ["pytest>=8"]

[project.scripts]
laclaugpt = "laclaugpt.cli:main"

[tool.setuptools.packages.find]
include = ["laclaugpt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]