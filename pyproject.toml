[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "laclaugpt-discourse-analysis"
version = "2.0.0"
description = "Evidence-linked computational discourse analysis with Laclau, Mouffe and Palonen"
readme = "README.md"
requires-python = ">=3.11"
license = "CC0-1.0"
authors = [
  { name = "Tomi Toivio" },
]
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0",
  "pandas>=2.1,<3",
  "ollama>=0.4",
  "networkx>=3.2",
]

[project.optional-dependencies]
splitting = [
  "numpy>=1.26",
  "opencv-python-headless>=4.8,<5",
]
collector = [
  "websocket-client>=1.8",
  "tzdata>=2024.1",
]
collect = [
  "feedparser>=6.0",
  "trafilatura>=1.8",
]
test = [
  "pytest>=8.0",
]
dev = [
  "pytest>=8.0",
  "build>=1.2",
  "ruff>=0.11",
]
nlp = [
  "spacy>=3.7",
  "scikit-learn>=1.4",
  "gensim>=4.3",
  "sentence-transformers>=3.0",
  "statsmodels>=0.14",
]
research-experimental = [
  "pycorpdiff>=0.1.0a27,<0.2",
  "scattertext>=0.2.2,<0.3",
  "convokit>=4.1,<5; python_version < '3.13'",
  "hypothesaes>=2.0,<3",
  "textnets>=0.10,<0.11; python_version < '3.14'",
  "edsl>=1.0,<2",
]
services = [
  "pymongo>=4.6",
  "python-arango>=8.0",
  "redis>=5.0",
  "duckdb>=1.0",
  "chromadb>=0.5",
]
visualization = [
  "streamlit>=1.57",
  "plotly>=5.24",
]
parquet = [
  "pyarrow>=15",
]
inception = [
  "dkpro-cassis>=0.10",
]

[project.scripts]
laclaugpt = "laclaugpt.cli:main"
laclaugpt-dashboard = "laclaugpt.visualization.launcher:main"
laclaugpt-split = "laclaugpt.splitting.cli:main"

[tool.setuptools]
include-package-data = true
py-modules = [
  "pipeline",
  "llm",
  "run_config",
  "projects",
  "memory",
  "seed_codebook",
  "laclaugpt_processor",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "laclaugpt*",
  "collector*",
  "*_adapter*",
  "prompts*",
]
exclude = ["tests*"]

[tool.setuptools.package-data]
collector = [
  "config/*.yaml",
  "browser/*.js",
  "browser/*.json",
  "browser/modules/*.js",
  "firefox/extension/*.js",
  "firefox/extension/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
