name: API consolidation tests

on:
  pull_request:
    paths:
      - "laclaugpt/__init__.py"
      - "laclaugpt/model/**"
      - "laclaugpt/memory/**"
      - "laclaugpt/adapters/interchange.py"
      - "laclaugpt_memory/**"
      - "laclaugpt_model/**"
      - "laclaugpt_interchange/**"
      - "memory.py"
      - "laclaugpt_processor.py"
      - "tests/test_api_consolidation.py"
      - ".github/workflows/api-consolidation-tests.yml"
  push:
    branches: [main]
    paths:
      - "laclaugpt/__init__.py"
      - "laclaugpt/model/**"
      - "laclaugpt/memory/**"
      - "laclaugpt/adapters/interchange.py"
      - "laclaugpt_memory/**"
      - "laclaugpt_model/**"
      - "laclaugpt_interchange/**"
      - "memory.py"
      - "laclaugpt_processor.py"
      - "tests/test_api_consolidation.py"
      - ".github/workflows/api-consolidation-tests.yml"

permissions:
  contents: read

jobs:
  api-consolidation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pydantic

      - name: Compile consolidation surface
        run: |
          python -m compileall -q laclaugpt/__init__.py laclaugpt/model laclaugpt/memory
          python -m compileall -q laclaugpt_memory laclaugpt_model laclaugpt_interchange
          python -m compileall -q memory.py tests/test_api_consolidation.py

      - name: Canonical API regression tests
        run: python -m pytest -q tests/test_api_consolidation.py
