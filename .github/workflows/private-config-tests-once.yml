name: One-time private config test update

on:
  push:
    branches:
      - fix/private-operational-config-2026-09-11

permissions:
  contents: write

jobs:
  update-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/private-operational-config-2026-09-11

      - name: Patch tests
        run: python scripts/_private_config_test_patch.py

      - name: Remove transient patch files and commit
        run: |
          rm scripts/_private_config_test_patch.py
          rm .github/workflows/private-config-tests-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: use synthetic DAIR profile after privatizing config"
          git push origin HEAD:fix/private-operational-config-2026-09-11
