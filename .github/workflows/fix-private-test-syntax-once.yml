name: One-time private config test syntax fix

on:
  push:
    branches:
      - fix/private-operational-config-2026-09-11

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/private-operational-config-2026-09-11
      - name: Fix Windows-path test literal
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_collect_dair.py')
          lines = p.read_text(encoding='utf-8').splitlines()
          matches = [i for i, line in enumerate(lines) if 'for secret in (' in line and 'api_key' in line]
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one target line, found {len(matches)}')
          lines[matches[0]] = r'        for secret in ("api_key", "password", "bearer ", r"c:\users", "/scratch/")'
          p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          Path('.github/workflows/fix-private-test-syntax-once.yml').unlink()
          PY
      - name: Commit fix and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: fix private profile path literal"
          git push origin HEAD:fix/private-operational-config-2026-09-11
