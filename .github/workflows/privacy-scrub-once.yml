name: One-time privacy scrub

on:
  push:
    branches: [fix/privacy-hygiene-2026-09-11]

permissions:
  contents: write

jobs:
  scrub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/privacy-hygiene-2026-09-11

      - name: Scrub residual machine-specific identifiers
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "laclaugpt_memory/__init__.py": [
                  (
                      "LACLAUGPT_MEMORY_DIR=/scratch/project_2009497/laclaugpt2/memory",
                      "LACLAUGPT_MEMORY_DIR=${LACLAUGPT_DATA_DIR}/memory",
                  ),
              ],
              "docs/DATA_MODEL_2_0_PLAN.md": [
                  ("Laskin", "local GPU host"),
              ],
              "pipeline.py": [
                  ("stage-aware local model routing (Laskin AI26)",
                   "stage-aware local model routing (AI26 local GPU)"),
              ],
              "tests/test_stage_model_routing.py": [
                  ("Stage-aware local model routing tests (Laskin AI26, Tomi's 2026-09-08 rule).",
                   "Stage-aware local model routing tests (AI26 local-GPU routing)."),
              ],
          }

          for name, pairs in replacements.items():
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"expected privacy scrub target missing: {name}: {old}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")

          Path(".github/workflows/privacy-scrub-once.yml").unlink()
          PY

      - name: Commit scrubbed files and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "privacy: scrub residual machine-specific identifiers"
          git push origin HEAD:fix/privacy-hygiene-2026-09-11
