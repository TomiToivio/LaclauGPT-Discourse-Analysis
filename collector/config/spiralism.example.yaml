# LaclauGPT collector - SYNTHETIC example for the AI Spiralism source family.
#
# This file demonstrates the collector schema only. It intentionally contains
# no real AI26 targets, discovery queries, collection window or live enablement
# state. Copy it to a private location and replace the EXAMPLE values there:
#
#   cp collector/config/spiralism.example.yaml \
#      ~/.config/laclaugpt/sources/ai-spiralism.private.yaml
#
# Operational source selection stays outside the public repository. See
# docs/DATA_COLLECTION_CONFIGURATION.md.

study: ai-spiralism-example
timezone: UTC

# Obviously synthetic dates: replace only in the private operator config.
window:
  start: "2000-01-01"
  end: "2000-01-02"

# Platform entries demonstrate the schema. All are off, and URLs are fictional.
platforms:
  reddit:
    enabled: false
    base_urls:
      - "https://example.invalid/community/{handle}"
  web:
    enabled: false
    base_urls:
      - "https://example.invalid/{url}"
  x:
    enabled: false
    base_urls:
      - "https://example.invalid/account/{handle}"
    with_replies: false

media:
  download: false
  storage: filesystem
  verify_checksums: true

# Fictional targets only. Real source groups and account lists belong in the
# private copy, never in this public template.
groups:
  - id: example-source-group
    name: Fictional public source group
    arena: example
    source_family: ai-spiralism
    category: synthetic_spirituality
    subcategory: spiralism
    formation_seed: null
    notes: >-
      Synthetic schema example only. Source-family membership is sampling
      provenance and never an automatic discourse classification.
    accounts:
      reddit:
        - EXAMPLE_COMMUNITY_A
        - EXAMPLE_COMMUNITY_B

# Fictional placeholders only. Replace privately with the operator's actual
# discovery terms if discovery search is used.
discovery_queries:
  - EXAMPLE_QUERY_A
  - EXAMPLE_QUERY_B

provenance:
  fields:
    - source_url
    - platform
    - timestamp
    - query_or_community
    - collection_method
  note: >-
    The canonical CollectRecord -> SourceItem / IngestionRecord spine carries
    these fields. Public provenance documentation does not publish private
    source-selection configuration.

# NOTES
# - handles are stored exactly as supplied (no silent corrections)
# - public/research-relevant collection and access rules still apply
# - replace every EXAMPLE value only in private operator configuration
