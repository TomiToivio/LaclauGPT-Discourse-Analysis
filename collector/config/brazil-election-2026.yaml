# Brazilian election study 2026 — LaclauGPT social-media collection
#
# Study: seven main presidential candidates + two parties (PT, PL) on
# Instagram, TikTok and X. 7 September – 10 October 2026, inclusive.
#
# NOTE (issue #20): the researcher says SEVEN main presidential candidates,
# but the supplied account list names SIX. The seventh candidate is NOT
# invented here — add it below when the researchers supply the account,
# and `expected_candidates` keeps flagging the gap until then.

study: brazil-presidential-2026
timezone: America/Sao_Paulo
expected_candidates: 7

window:
  start: "2026-09-07"
  end: "2026-10-10"

platforms:
  tiktok:
    enabled: true
    base_urls: ["https://www.tiktok.com/@{handle}"]
  x:
    enabled: true
    base_urls:
      - "https://x.com/{handle}"
      - "https://x.com/{handle}/with_replies"
  instagram:
    enabled: true
    base_urls:
      - "https://www.instagram.com/{handle}/"
      - "https://www.instagram.com/{handle}/reels/"

candidates:
  - name: Lula
    party: PT
    handles:
      instagram: [lulaoficial, brasilcomlula]
      tiktok: [lulaoficial, brasilcomlula_]
      x: [LulaOficial, OBrasilComLula]
  - name: Flávio Bolsonaro
    party: PL
    handles:
      instagram: [flaviobolsonaro]
      tiktok: [flaviobolsonaro]
      x: [flaviobolsonaro]
  - name: Romeu Zema
    party: NOVO
    handles:
      instagram: [romeuzemaoficial]
      tiktok: [romeuzemaoficial]
      x: [RomeuZema]
  - name: Ronaldo Caiado
    party: PSD
    handles:
      instagram: [ronaldocaiado]
      tiktok: [ronaldocaiado]
      x: [ronaldocaiado]
  - name: Renan Santos
    party: MISSÃO
    handles:
      instagram: [renansantosmbl]
      tiktok: [renansantosmbl]
      x: [RenanSantosMBL]
  - name: Augusto Cury
    party: AVANTE
    handles:
      instagram: [augustocury]
      tiktok: [augustocuryoficial]
      x: [augustocury]

parties:
  - name: PT
    handles:
      instagram: [ptbrasil]
      tiktok: [ptbrasil]
      x: [ptbrasil]
  - name: PL
    handles:
      instagram: [plnacional22]
      tiktok: [plnacional_]
      x: [plnacional_]