# EP24 pilot arena config — Finland + Poland reprocessing (issue #73)
# Uses the country codebooks in run_configs/ep24_codebooks.yaml.
# Runtime paths are intentionally supplied by CLI/environment; public configs
# must not encode researcher usernames, storage-project IDs or private hosts.

name: ep24-pilot
paper_section: "3.3"
topic_key: ep24-finland
source_platform: video
languages: [fi, pl, en, pt, es]
countries: [FI]

memory_dir: null
data_root: null
csv_dir: null
videos_dir: null
output_dir: null
repo_root: null
model: gemma4:31b-cloud
ollama_mode: cloud
ollama_host: ""
allow_cloud_fallback: true
temperature: 0.0
num_ctx: 24576
num_predict: 4096
stages:
  summary: true
  discourse: true
  populism: true
  postprocess: true

analysis_switches:
  sentiment: true
  context_memory: true
  temporal: true

codebook: ep24_finland
seed_codebook_mode: human_curated

improvements:
  fresh_multimodal: true
  keyframes_v2: true
  evidence_gates: true
  abstention_allowed: true
  neutral_priming: true
  review_sidecar: true
