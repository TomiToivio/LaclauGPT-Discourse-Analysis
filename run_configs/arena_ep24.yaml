# EP24 pilot arena config — Finland + Poland reprocessing (issue #73)
# Uses the country codebooks in run_configs/ep24_codebooks.yaml.
# Stages: summary/discourse/postprocess on the FRESH multimodal transcripts
# (re-derived from Allas videos per the revised plan), legacy columns ride
# only as provenance metadata.

name: ep24-pilot
paper_section: "3.3"
topic_key: ep24-finland        # per-country override: ep24-poland
source_platform: video         # Allas HEPP24 videos (Instagram/TikTok)
language: fi                   # per country: pl for Poland
countries: [FI]                # [PL] for the Poland job

memory_dir: /scratch/project_2009497/laclaugpt2/memory   # single shared codebook on Roihu scratch
data_root: /scratch/project_2009497/laclaugpt2           # phase-0 landing root
csv_dir: /scratch/project_2009497/laclaugpt2/ep24/csv    # fetched subset CSVs + manifests
videos_dir: /scratch/project_2009497/laclaugpt2/ep24/videos  # fetch-stage workdir override ($TMPDIR preferred for streaming)
output_dir: /scratch/project_2009497/laclaugpt2/ep24/annotations  # annotations.jsonl + provenance land here
repo_root: /users/totoivio/LaclauGPT-Discourse-Analysis  # checked-out repo on Roihu (pipeline.py, prompts/, config/)
model: gemma4:31b-cloud        # Ollama Cloud for ALL processing stages (2026-09-08 decision)
ollama_mode: cloud
ollama_host: ""                # cloud endpoint resolved by llm.py routing
allow_cloud_fallback: true     # cloud IS the primary path now (local = fallback)
temperature: 0.0
num_ctx: 24576                 # fresh faster-whisper transcripts are long
num_predict: 4096
stages:
  summary: true
  discourse: true
  populism: true
  postprocess: true

# module switches (issue #48): authoritative, lossless
analysis_switches:
  sentiment: true              # descriptive only, separate from affect
  context_memory: true
  temporal: true

# codebook grounding (from run_configs/ep24_codebooks.yaml)
codebook: ep24_finland         # ep24_poland for the Poland job
seed_codebook_mode: human_curated   # never let model output feed seeds back

# what beats the old pipeline (viritelmät, issue #73):
improvements:
  fresh_multimodal: true        # faster-whisper large-v3 + vad_filter (not legacy columns)
  keyframes_v2: true            # duration÷6, >=10s gap (old: fixed 30 s)
  evidence_gates: true          # verbatim gate on every coding family (issue #60)
  abstention_allowed: true      # INV_ABSTAIN; partial evidence kept (issue #59)
  neutral_priming: true         # no 'prefer EXISTING', alphabetical preview (issue #62)
  review_sidecar: true          # SQLite review store, not researcher_notes.json