# EP24 SAMPLE run config — 20+20 videos, full multimodal chain.
# Runtime paths come from the launcher/environment. This public config contains
# no user-specific checkout path, storage-project ID or private host detail.

name: ep24-roihu-sample
paper_section: "3.3"
topic_key: ep24-finland
source_platform: video
languages: [fi, pl, en, pt, es, it]
countries: [FI, PL]

memory_dir: null
data_root: null
csv_dir: null
videos_dir: null
output_dir: null
repo_root: null

model: gemma4:31b-cloud
ollama_mode: cloud
ollama_host: ""
allow_cloud_fallback: true
temperature: 0.0
num_ctx: 24576
num_predict: 4096
stages:
  summary: true
  discourse: true
  populism: true
  postprocess: true

analysis_switches:
