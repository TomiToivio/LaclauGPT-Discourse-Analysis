# AI26 resistance-source manifest — verified 2026-09-11
#
# Organized AI-resistance sources for the AI26 corpus (TASK2).
# This family INTENTIONALLY OVERSAMPLES organized AI resistance:
# existing AI26 sources already carry substantial elite, industry,
# techno-optimist and x-risk material (see ai26-rss-sources.toml).
#
# RESEARCH PRINCIPLE (paper/PAPER.md): source families below are SAMPLING
# HEURISTICS, never ideological ground truth. critical AI / anti-AI /
# pause / safety / x-risk / anti-AGI / labour / environmental resistance
# are kept analytically DISTINCT — whether they articulate one political
# formation is an empirical question for LaclauGPT, not an assumption.
#
# Types: rss = canonical RSS collector; web = canonical web collector;
# discovery_index = collect as provenance for finding further orgs.
# Run RSS entries:  laclaugpt collect rss config/projects/ai26-resistance-sources.toml
# Run web entries:  laclaugpt collect web <url> (see docs/AI26_RSS_SOURCES.md)

[[feed]]
name = "pauseai_news"
organization = "PauseAI"
homepage = "https://pauseai.info/"
feed_url = "https://pauseai.info/rss.xml"
source_type = "rss"
source_family = "pause_ai / xrisk_mobilization"
sampling_rationale = "International pause movement: campaign posts, protest announcements, policy demands; AI labs and the AI race constructed as antagonist; links x-risk to immediate social harms."
country = "global"
scope = "movement"
priority = "P1"
active = true
discovered_via = "task specification"
last_verified = "2026-09-11"

[[feed]]
name = "controlai_blog"
organization = "ControlAI"
homepage = "https://controlai.org/"
feed_url = "https://blog.controlai.org/feed"
source_type = "rss"
source_family = "anti_agi / democratic_control"
sampling_rationale = "Superintelligence prohibition + democratic control advocacy; AI-safety discourse moving into mainstream politics (policymakers, parliament). Kept analytically SEPARATE from PauseAI."
country = "UK"
scope = "movement"
priority = "P1"
active = true
discovered_via = "task specification"
last_verified = "2026-09-11"

