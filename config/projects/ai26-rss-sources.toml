# AI26 RSS/Atom source manifest — verified 2026-09-11
#
# Feeds for the AI26 ideological-contestation corpus. Each entry keeps
# sampling provenance (source_family / sampling_rationale) — these are
# SENSITISING HEURISTICS, not ideological ground truth (paper/PAPER.md
# §2.2: sources guide initial selection, never exhaustive categories).
# LaclauGPT infers actual articulations from individual texts.
#
# Format: TOML table array, one [[feed]] per source.
# The canonical CLI keeps working with plain one-URL-per-line files:
#   laclaugpt collect rss <file> --fetch-article
# Both formats load through the same loader (laclaugpt/collect/cli.py).

