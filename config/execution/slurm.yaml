execution: slurm
scheduler: slurm
mode: batch
recurrence: one_shot
resources:
  partition: gpu
  time: "04:00:00"
  cpus: 8
  memory: 64G
  gpus: 1
runtime:
  use_tmpdir: true          # $TMPDIR for transient video streams (never persisted)
  resume: true
  checkpoint: true
  retry_failed_items: true
  skip_already_processed: true
data_root: LACLAUGPT_DATA_DIR   # EP24 phase-0 landing (csv/, videos/, annotations/, memory/)
repo_root: LACLAUGPT_REPO_ROOT   # checked-out repo on Roihu (code, prompts, run_configs)

