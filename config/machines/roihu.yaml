machine: roihu
backends:
  source: mongodb_remote
  analysis: arangodb_remote
  graph: arangodb_remote
  vector: chromadb_remote
  cache: redis_remote
  analytics: duckdb_local
  blob: filesystem
services:
  collector:
    enabled: false
  analysis:
    enabled: true
  dashboard:
    enabled: false
  llm:
    mode: local
    provider: ollama
    model: gemma4:26b
    base_url: ${OLLAMA_BASE_URL:-http://127.0.0.1:11434}
  context_memory:
    enabled: true
runtime:
  topology: slurm-analysis-only
  gpu_required: true
  temporary_directory: ${TMPDIR}
